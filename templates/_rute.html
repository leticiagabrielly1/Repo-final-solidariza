{# Widget da Sofia, assistente virtual. Montado pelo static/rute.js; só aparece quando o JavaScript está ativo. #}
<svg width="0" height="0" style="position:absolute" aria-hidden="true" focusable="false">
  <symbol id="rute-avatar" viewBox="0 0 40 40">
    <circle cx="20" cy="20" r="20" fill="currentColor"/>
    <text x="20" y="27.5" text-anchor="middle" font-family="Georgia,'Times New Roman',serif" font-size="23" font-weight="700" font-style="italic" fill="#fff">R</text>
    <circle cx="32" cy="9" r="4.2" fill="#ffcf17" stroke="#fff" stroke-width="1.5"/>
  </symbol>
</svg>
<div class="rute" id="rute" data-perfil="{{ rute_ui.perfil }}" data-endpoint="{{ url_for('rute_mensagem') }}" data-csrf="{{ session.csrf }}" data-chave="{{ rute_ui.chave }}" data-saudacao="{{ rute_ui.saudacao }}" data-sugestoes='{{ rute_ui.sugestoes|tojson }}'>
  <button type="button" class="rute-fab" id="rute-fab" aria-expanded="false" aria-controls="rute-panel">
    <img class="rute-avatar" src="{{ url_for('static',filename='sofia-avatar.png') }}" alt="Sofia">
    <span class="rute-fab-texto">Fale com a Sofia</span>
  </button>
  <section class="rute-panel" id="rute-panel" role="dialog" aria-label="Conversa com a Sofia, assistente virtual" hidden>
    <header class="rute-topo">
      <img class="rute-avatar" src="{{ url_for('static',filename='sofia-avatar.png') }}" alt="Sofia">
      <div class="rute-titulo"><strong>Sofia</strong><small>Assistente virtual · {{ rute_ui.rotulo }}</small></div>
      <button type="button" class="rute-icone" id="rute-limpar" aria-label="Limpar conversa" title="Limpar conversa">↺</button>
      <button type="button" class="rute-icone" id="rute-fechar" aria-label="Fechar conversa" title="Fechar">✕</button>
    </header>
    <div class="rute-log" id="rute-log" role="log" aria-live="polite" aria-relevant="additions"></div>
    <div class="rute-sugestoes" id="rute-sugestoes" role="group" aria-label="Sugestões de perguntas"></div>
    <form class="rute-form" id="rute-form" autocomplete="off">
      <label class="rute-sr" for="rute-entrada">Sua mensagem para a Sofia</label>
      <input id="rute-entrada" type="text" maxlength="500" placeholder="Pergunte algo à Sofia…" enterkeyhint="send">
      <button type="submit" class="rute-enviar" id="rute-enviar" aria-label="Enviar mensagem">➤</button>
    </form>
    <p class="rute-aviso">A Sofia é uma assistente virtual e pode errar. Nunca informe sua senha.</p>
  </section>
</div>
